name: CI

on:
  push:
    branches:
      - main
      - qt-001-repository-ci-foundation
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock
      - name: Verify development launcher setup guidance
        run: |
          set +e
          output="$(node scripts/dev.mjs 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'npm run setup'
      - name: Validate Docker secret exclusions
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('apps/web/.dockerignore'), Path('apps/server/.dockerignore')]:
              patterns = {line.strip() for line in path.read_text().splitlines() if line.strip()}
              assert '.env' in patterns, f'{path}: missing .env exclusion'
              assert '.env.*' in patterns, f'{path}: missing .env.* exclusion'
          PY
      - run: npm run setup:ci
      - run: npm run check
      - name: Validate root development launcher syntax
        run: node --check scripts/dev.mjs

  windows-dev-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - name: Validate Vite child process path on Windows
        run: |
          node --check scripts/dev.mjs
          node -e "const { spawnSync } = require('node:child_process'); const result = spawnSync(process.execPath, ['apps/web/node_modules/vite/bin/vite.js', '--version'], { stdio: 'inherit' }); process.exit(result.status ?? 1)"

  codex-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate project Codex configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          config_path = Path('.codex/config.toml')
          with config_path.open('rb') as handle:
              config = tomllib.load(handle)

          agents_config = config.get('agents')
          assert isinstance(agents_config, dict), '[agents] table is required'
          assert agents_config.get('enabled') is True, 'project agents must be enabled'
          max_threads = agents_config.get('max_concurrent_threads_per_session')
          assert isinstance(max_threads, int) and max_threads >= 1, 'max concurrent threads must be a positive integer'

          required_fields = {'name', 'description', 'developer_instructions'}
          expected_agents = {
              'explorer': Path('.codex/agents/explorer.toml'),
              'reviewer': Path('.codex/agents/reviewer.toml'),
          }

          for expected_name, path in expected_agents.items():
              with path.open('rb') as handle:
                  agent = tomllib.load(handle)
              missing = required_fields - agent.keys()
              assert not missing, f'{path}: missing required fields {sorted(missing)}'
              for field in required_fields:
                  assert isinstance(agent[field], str) and agent[field].strip(), f'{path}: {field} must be non-empty'
              assert agent['name'] == expected_name, f'{path}: name must match its configured role'
              assert agent.get('sandbox_mode') == 'read-only', f'{path}: helper role must be read-only'

          for path in sorted(Path('.codex/agents').glob('*.toml')):
              with path.open('rb') as handle:
                  tomllib.load(handle)

          print('Codex project configuration is valid TOML with required read-only helper roles.')
          PY

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [quality, windows-dev-launcher, codex-config]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        run: docker compose up --build --wait
      - name: Verify API health
        run: test "$(curl --fail --silent http://localhost:8000/health)" = '{"status":"ok","service":"quotepilot-api"}'
      - name: Verify web shell
        run: curl --fail --silent http://localhost:5173 | grep -q '<title>QuotePilot</title>'
      - name: Stop local stack
        if: always()
        run: docker compose down -v
